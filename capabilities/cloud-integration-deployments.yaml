naftiko: 1.0.0-alpha2
info:
  label: TIBCO Cloud Integration API — Deployments
  description: 'TIBCO Cloud Integration API — Deployments. 5 operations. Lead operation: Deploy an integration app. Self-contained
    Naftiko capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Deployments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-integration-deployments
    baseUri: https://integration.cloud.tibco.com/api/v1
    description: TIBCO Cloud Integration API — Deployments business capability. Self-contained, no shared references.
    resources:
    - name: apps-appId-push
      path: /apps/{appId}/push
      operations:
      - name: deployapp
        method: POST
        description: Deploy an integration app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: deployments
      path: /deployments
      operations:
      - name: listdeployments
        method: GET
        description: List deployments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deployments-deploymentId
      path: /deployments/{deploymentId}
      operations:
      - name: getdeployment
        method: GET
        description: Get a deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: undeployapp
        method: DELETE
        description: Undeploy an app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: deployments-deploymentId-scale
      path: /deployments/{deploymentId}/scale
      operations:
      - name: scaledeployment
        method: POST
        description: Scale a deployment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-integration-deployments-rest
    port: 8080
    description: REST adapter for TIBCO Cloud Integration API — Deployments. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/apps/{appid}/push
      name: apps-appid-push
      description: REST surface for apps-appId-push.
      operations:
      - method: POST
        name: deployapp
        description: Deploy an integration app
        call: cloud-integration-deployments.deployapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deployments
      name: deployments
      description: REST surface for deployments.
      operations:
      - method: GET
        name: listdeployments
        description: List deployments
        call: cloud-integration-deployments.listdeployments
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deployments/{deploymentid}
      name: deployments-deploymentid
      description: REST surface for deployments-deploymentId.
      operations:
      - method: GET
        name: getdeployment
        description: Get a deployment
        call: cloud-integration-deployments.getdeployment
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: undeployapp
        description: Undeploy an app
        call: cloud-integration-deployments.undeployapp
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deployments/{deploymentid}/scale
      name: deployments-deploymentid-scale
      description: REST surface for deployments-deploymentId-scale.
      operations:
      - method: POST
        name: scaledeployment
        description: Scale a deployment
        call: cloud-integration-deployments.scaledeployment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-integration-deployments-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO Cloud Integration API — Deployments. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: deploy-integration-app
      description: Deploy an integration app
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-integration-deployments.deployapp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-deployments
      description: List deployments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-integration-deployments.listdeployments
      outputParameters:
      - type: object
        mapping: $.
    - name: get-deployment
      description: Get a deployment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-integration-deployments.getdeployment
      outputParameters:
      - type: object
        mapping: $.
    - name: undeploy-app
      description: Undeploy an app
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-integration-deployments.undeployapp
      outputParameters:
      - type: object
        mapping: $.
    - name: scale-deployment
      description: Scale a deployment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-integration-deployments.scaledeployment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
