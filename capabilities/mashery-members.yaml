naftiko: 1.0.0-alpha2
info:
  label: TIBCO Mashery API Management — Members
  description: 'TIBCO Mashery API Management — Members. 2 operations. Lead operation: List portal members. Self-contained
    Naftiko capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: mashery-members
    baseUri: https://api.mashery.com/v3
    description: TIBCO Mashery API Management — Members business capability. Self-contained, no shared references.
    resources:
    - name: rest-members
      path: /rest/members
      operations:
      - name: listmembers
        method: GET
        description: List portal members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: rest-members-memberId
      path: /rest/members/{memberId}
      operations:
      - name: getmember
        method: GET
        description: Get a portal member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: mashery-members-rest
    port: 8080
    description: REST adapter for TIBCO Mashery API Management — Members. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/members
      name: rest-members
      description: REST surface for rest-members.
      operations:
      - method: GET
        name: listmembers
        description: List portal members
        call: mashery-members.listmembers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/members/{memberid}
      name: rest-members-memberid
      description: REST surface for rest-members-memberId.
      operations:
      - method: GET
        name: getmember
        description: Get a portal member
        call: mashery-members.getmember
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: mashery-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO Mashery API Management — Members. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-portal-members
      description: List portal members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mashery-members.listmembers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-portal-member
      description: Get a portal member
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mashery-members.getmember
      outputParameters:
      - type: object
        mapping: $.
