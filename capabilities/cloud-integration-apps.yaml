naftiko: 1.0.0-alpha2
info:
  label: TIBCO Cloud Integration API — Apps
  description: 'TIBCO Cloud Integration API — Apps. 6 operations. Lead operation: List integration apps. Self-contained Naftiko
    capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Apps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-integration-apps
    baseUri: https://integration.cloud.tibco.com/api/v1
    description: TIBCO Cloud Integration API — Apps business capability. Self-contained, no shared references.
    resources:
    - name: apps
      path: /apps
      operations:
      - name: listapps
        method: GET
        description: List integration apps
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: Filter expression for app name or type
      - name: createapp
        method: POST
        description: Create an integration app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apps-appId
      path: /apps/{appId}
      operations:
      - name: getapp
        method: GET
        description: Get an integration app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateapp
        method: PUT
        description: Update an integration app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteapp
        method: DELETE
        description: Delete an integration app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appId-export
      path: /apps/{appId}/export
      operations:
      - name: exportapp
        method: GET
        description: Export an integration app
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-integration-apps-rest
    port: 8080
    description: REST adapter for TIBCO Cloud Integration API — Apps. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/apps
      name: apps
      description: REST surface for apps.
      operations:
      - method: GET
        name: listapps
        description: List integration apps
        call: cloud-integration-apps.listapps
        with:
          filter: rest.filter
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapp
        description: Create an integration app
        call: cloud-integration-apps.createapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{appid}
      name: apps-appid
      description: REST surface for apps-appId.
      operations:
      - method: GET
        name: getapp
        description: Get an integration app
        call: cloud-integration-apps.getapp
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateapp
        description: Update an integration app
        call: cloud-integration-apps.updateapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapp
        description: Delete an integration app
        call: cloud-integration-apps.deleteapp
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apps/{appid}/export
      name: apps-appid-export
      description: REST surface for apps-appId-export.
      operations:
      - method: GET
        name: exportapp
        description: Export an integration app
        call: cloud-integration-apps.exportapp
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-integration-apps-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO Cloud Integration API — Apps. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-integration-apps
      description: List integration apps
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-integration-apps.listapps
      with:
        filter: tools.filter
      outputParameters:
      - type: object
        mapping: $.
    - name: create-integration-app
      description: Create an integration app
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-integration-apps.createapp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-integration-app
      description: Get an integration app
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-integration-apps.getapp
      outputParameters:
      - type: object
        mapping: $.
    - name: update-integration-app
      description: Update an integration app
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cloud-integration-apps.updateapp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-integration-app
      description: Delete an integration app
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-integration-apps.deleteapp
      outputParameters:
      - type: object
        mapping: $.
    - name: export-integration-app
      description: Export an integration app
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-integration-apps.exportapp
      outputParameters:
      - type: object
        mapping: $.
