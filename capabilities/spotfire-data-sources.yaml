naftiko: 1.0.0-alpha2
info:
  label: TIBCO Spotfire Analytics API — Data Sources
  description: 'TIBCO Spotfire Analytics API — Data Sources. 4 operations. Lead operation: List data sources. Self-contained
    Naftiko capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Data Sources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: spotfire-data-sources
    baseUri: https://spotfire.cloud.tibco.com/api/rest/v1
    description: TIBCO Spotfire Analytics API — Data Sources business capability. Self-contained, no shared references.
    resources:
    - name: datasources
      path: /datasources
      operations:
      - name: listdatasources
        method: GET
        description: List data sources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createdatasource
        method: POST
        description: Create a data source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: datasources-dataSourceId
      path: /datasources/{dataSourceId}
      operations:
      - name: getdatasource
        method: GET
        description: Get a data source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletedatasource
        method: DELETE
        description: Delete a data source
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: spotfire-data-sources-rest
    port: 8080
    description: REST adapter for TIBCO Spotfire Analytics API — Data Sources. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/datasources
      name: datasources
      description: REST surface for datasources.
      operations:
      - method: GET
        name: listdatasources
        description: List data sources
        call: spotfire-data-sources.listdatasources
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createdatasource
        description: Create a data source
        call: spotfire-data-sources.createdatasource
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/datasources/{datasourceid}
      name: datasources-datasourceid
      description: REST surface for datasources-dataSourceId.
      operations:
      - method: GET
        name: getdatasource
        description: Get a data source
        call: spotfire-data-sources.getdatasource
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletedatasource
        description: Delete a data source
        call: spotfire-data-sources.deletedatasource
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: spotfire-data-sources-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO Spotfire Analytics API — Data Sources. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-data-sources
      description: List data sources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotfire-data-sources.listdatasources
      outputParameters:
      - type: object
        mapping: $.
    - name: create-data-source
      description: Create a data source
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: spotfire-data-sources.createdatasource
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-data-source
      description: Get a data source
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotfire-data-sources.getdatasource
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-data-source
      description: Delete a data source
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: spotfire-data-sources.deletedatasource
      outputParameters:
      - type: object
        mapping: $.
