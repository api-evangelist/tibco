naftiko: 1.0.0-alpha2
info:
  label: TIBCO BusinessEvents API — Rules
  description: 'TIBCO BusinessEvents API — Rules. 5 operations. Lead operation: List business rules. Self-contained Naftiko
    capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Rules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: businessevents-rules
    baseUri: https://api.tibco.com/businessevents/v1
    description: TIBCO BusinessEvents API — Rules business capability. Self-contained, no shared references.
    resources:
    - name: rules
      path: /rules
      operations:
      - name: listrules
        method: GET
        description: List business rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createrule
        method: POST
        description: Create a business rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: rules-ruleId
      path: /rules/{ruleId}
      operations:
      - name: getrule
        method: GET
        description: Get a business rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updaterule
        method: PUT
        description: Update a business rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleterule
        method: DELETE
        description: Delete a business rule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: businessevents-rules-rest
    port: 8080
    description: REST adapter for TIBCO BusinessEvents API — Rules. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/rules
      name: rules
      description: REST surface for rules.
      operations:
      - method: GET
        name: listrules
        description: List business rules
        call: businessevents-rules.listrules
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createrule
        description: Create a business rule
        call: businessevents-rules.createrule
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/rules/{ruleid}
      name: rules-ruleid
      description: REST surface for rules-ruleId.
      operations:
      - method: GET
        name: getrule
        description: Get a business rule
        call: businessevents-rules.getrule
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updaterule
        description: Update a business rule
        call: businessevents-rules.updaterule
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleterule
        description: Delete a business rule
        call: businessevents-rules.deleterule
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: businessevents-rules-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO BusinessEvents API — Rules. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-business-rules
      description: List business rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: businessevents-rules.listrules
      outputParameters:
      - type: object
        mapping: $.
    - name: create-business-rule
      description: Create a business rule
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: businessevents-rules.createrule
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-business-rule
      description: Get a business rule
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: businessevents-rules.getrule
      outputParameters:
      - type: object
        mapping: $.
    - name: update-business-rule
      description: Update a business rule
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: businessevents-rules.updaterule
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-business-rule
      description: Delete a business rule
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: businessevents-rules.deleterule
      outputParameters:
      - type: object
        mapping: $.
