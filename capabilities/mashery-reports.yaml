naftiko: 1.0.0-alpha2
info:
  label: TIBCO Mashery API Management — Reports
  description: 'TIBCO Mashery API Management — Reports. 1 operations. Lead operation: Get API call report. Self-contained
    Naftiko capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Reports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: mashery-reports
    baseUri: https://api.mashery.com/v3
    description: TIBCO Mashery API Management — Reports business capability. Self-contained, no shared references.
    resources:
    - name: rest-reports-calls
      path: /rest/reports/calls
      operations:
      - name: getcallreport
        method: GET
        description: Get API call report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
          description: Report start date (ISO 8601)
          required: true
        - name: endDate
          in: query
          type: string
          description: Report end date (ISO 8601)
          required: true
        - name: serviceId
          in: query
          type: string
          description: Filter by service ID
        - name: endpointId
          in: query
          type: string
          description: Filter by endpoint ID
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: mashery-reports-rest
    port: 8080
    description: REST adapter for TIBCO Mashery API Management — Reports. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/reports/calls
      name: rest-reports-calls
      description: REST surface for rest-reports-calls.
      operations:
      - method: GET
        name: getcallreport
        description: Get API call report
        call: mashery-reports.getcallreport
        with:
          startDate: rest.startDate
          endDate: rest.endDate
          serviceId: rest.serviceId
          endpointId: rest.endpointId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: mashery-reports-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO Mashery API Management — Reports. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-api-call-report
      description: Get API call report
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: mashery-reports.getcallreport
      with:
        startDate: tools.startDate
        endDate: tools.endDate
        serviceId: tools.serviceId
        endpointId: tools.endpointId
      outputParameters:
      - type: object
        mapping: $.
