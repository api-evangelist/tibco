naftiko: 1.0.0-alpha2
info:
  label: TIBCO BusinessEvents API — Channels
  description: 'TIBCO BusinessEvents API — Channels. 1 operations. Lead operation: List event channels. Self-contained Naftiko
    capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Channels
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: businessevents-channels
    baseUri: https://api.tibco.com/businessevents/v1
    description: TIBCO BusinessEvents API — Channels business capability. Self-contained, no shared references.
    resources:
    - name: channels
      path: /channels
      operations:
      - name: listchannels
        method: GET
        description: List event channels
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: businessevents-channels-rest
    port: 8080
    description: REST adapter for TIBCO BusinessEvents API — Channels. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/channels
      name: channels
      description: REST surface for channels.
      operations:
      - method: GET
        name: listchannels
        description: List event channels
        call: businessevents-channels.listchannels
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: businessevents-channels-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO BusinessEvents API — Channels. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-event-channels
      description: List event channels
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: businessevents-channels.listchannels
      outputParameters:
      - type: object
        mapping: $.
