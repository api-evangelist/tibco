naftiko: 1.0.0-alpha2
info:
  label: TIBCO Spotfire Analytics API — Library
  description: 'TIBCO Spotfire Analytics API — Library. 6 operations. Lead operation: List library items. Self-contained Naftiko
    capability covering one Tibco business surface.'
  tags:
  - Tibco
  - Library
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TIBCO_API_KEY: TIBCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: spotfire-library
    baseUri: https://spotfire.cloud.tibco.com/api/rest/v1
    description: TIBCO Spotfire Analytics API — Library business capability. Self-contained, no shared references.
    resources:
    - name: library
      path: /library
      operations:
      - name: listlibraryitems
        method: GET
        description: List library items
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: path
          in: query
          type: string
          description: Library folder path to list items from
        - name: type
          in: query
          type: string
          description: Filter by item type
        - name: search
          in: query
          type: string
          description: Search query for item names
    - name: library-itemId
      path: /library/{itemId}
      operations:
      - name: getlibraryitem
        method: GET
        description: Get a library item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatelibraryitem
        method: PUT
        description: Update a library item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletelibraryitem
        method: DELETE
        description: Delete a library item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: library-itemId-permissions
      path: /library/{itemId}/permissions
      operations:
      - name: getlibraryitempermissions
        method: GET
        description: Get library item permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatelibraryitempermissions
        method: PUT
        description: Update library item permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TIBCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: spotfire-library-rest
    port: 8080
    description: REST adapter for TIBCO Spotfire Analytics API — Library. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/library
      name: library
      description: REST surface for library.
      operations:
      - method: GET
        name: listlibraryitems
        description: List library items
        call: spotfire-library.listlibraryitems
        with:
          path: rest.path
          type: rest.type
          search: rest.search
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/library/{itemid}
      name: library-itemid
      description: REST surface for library-itemId.
      operations:
      - method: GET
        name: getlibraryitem
        description: Get a library item
        call: spotfire-library.getlibraryitem
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatelibraryitem
        description: Update a library item
        call: spotfire-library.updatelibraryitem
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletelibraryitem
        description: Delete a library item
        call: spotfire-library.deletelibraryitem
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/library/{itemid}/permissions
      name: library-itemid-permissions
      description: REST surface for library-itemId-permissions.
      operations:
      - method: GET
        name: getlibraryitempermissions
        description: Get library item permissions
        call: spotfire-library.getlibraryitempermissions
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatelibraryitempermissions
        description: Update library item permissions
        call: spotfire-library.updatelibraryitempermissions
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: spotfire-library-mcp
    port: 9090
    transport: http
    description: MCP adapter for TIBCO Spotfire Analytics API — Library. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-library-items
      description: List library items
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotfire-library.listlibraryitems
      with:
        path: tools.path
        type: tools.type
        search: tools.search
      outputParameters:
      - type: object
        mapping: $.
    - name: get-library-item
      description: Get a library item
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotfire-library.getlibraryitem
      outputParameters:
      - type: object
        mapping: $.
    - name: update-library-item
      description: Update a library item
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: spotfire-library.updatelibraryitem
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-library-item
      description: Delete a library item
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: spotfire-library.deletelibraryitem
      outputParameters:
      - type: object
        mapping: $.
    - name: get-library-item-permissions
      description: Get library item permissions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spotfire-library.getlibraryitempermissions
      outputParameters:
      - type: object
        mapping: $.
    - name: update-library-item-permissions
      description: Update library item permissions
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: spotfire-library.updatelibraryitempermissions
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
