meters:
  - name: licensed_entitlement
    unit: varies
    aggregation: sum
    dimensions:
      - product
      - environment
principles:
  - name: Visibility
    description: Map TIBCO contract entitlements (cores, instances, named users, API tier) to deployments;
      pull usage from product-native dashboards (Spotfire, BusinessWorks, Mashery analytics).
  - name: Allocation
    description: Allocate the TIBCO contract cost to the integration, analytics, or API platform team
      that owns each product line.
  - name: Optimization
    description: At renewal, right-size cores/instances and consolidate duplicate environments; retire
      unused Spotfire seats and BusinessWorks engines.
  - name: Accountability
    description: A platform owner is accountable for the TIBCO master agreement, true-up cycle, and renewal
      negotiation with Cloud Software Group.
