specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: TIBCO
providerId: tibco
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Integration
  - API Management
  - Rate Limiting
description: TIBCO's commercial products are licensed and provisioned per enterprise contract; there
  is no shared multi-tenant rate-limit page covering the portfolio. TIBCO Mashery and TIBCO Cloud Integration
  expose policy-driven rate-limit features that customers configure on their own gateways and tenants
  rather than caps imposed by TIBCO.
sources:
  - https://www.tibco.com/
notes: TIBCO products self-host or are tenanted; rate limits are customer-policy-driven, not vendor-imposed
  caps. No reconcilable public rate-limit numbers exist.
responseCodes:
  throttled: 429
limits:
  - name: Customer-Configured Policy
    scope: tenant
    metric: varies
    limit: see customer gateway / tenant configuration
policies:
  - name: Customer-Defined Policies
    description: For Mashery and TIBCO Cloud Integration, rate-limit, quota, and throttle policies are
      authored by the customer and applied per API plan or consumer key. TIBCO does not publish a global
      vendor-imposed limit.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
